name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy backend
      - name: Test
        run: pytest --cov=backend --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit detect-secrets && python -m pip install .
      - name: Dependency vulnerability audit
        run: pip-audit --strict
      - name: Secret scan
        run: detect-secrets scan --all-files --exclude-files '(^|/)\.git/' --exclude-files '(^|/)\.venv/'
